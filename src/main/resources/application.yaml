spring:
  application:
    name: security-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/logitrack_security}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:3000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_LOCATION:file:/run/secrets/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_LOCATION:file:/run/secrets/jwt-public.pem}
    issuer: ${JWT_ISSUER:logitrack-security}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:3600}

mail:
  notifications:
    enabled: ${MAIL_NOTIFICATIONS_ENABLED:false}
    from: ${SMTP_FROM:no-reply@logitrack.invalid}
    poll-delay-ms: ${MAIL_POLL_DELAY_MS:5000}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
