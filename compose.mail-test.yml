services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: logitrack_security
      MYSQL_USER: logitrack_test
      MYSQL_PASSWORD: ${MAIL_TEST_DB_PASSWORD:?Set a disposable database password}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    healthcheck:
      test: [CMD-SHELL, 'mysql --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD" --execute="SELECT 1" "$$MYSQL_DATABASE"']
      interval: 3s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - '127.0.0.1::8025'
  security:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env.test.example
    environment:
      DB_URL: jdbc:mysql://mysql:3306/logitrack_security
      DB_USERNAME: logitrack_test
      DB_PASSWORD: ${MAIL_TEST_DB_PASSWORD:?Set a disposable database password}
      JWT_PRIVATE_KEY_LOCATION: file:/run/keys/private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/public.pem
      SPRING_CLOUD_CONFIG_ENABLED: 'false'
      EUREKA_CLIENT_ENABLED: 'false'
    volumes:
      - type: bind
        source: ${MAIL_TEST_KEY_DIR:?Set the directory of disposable RSA keys}
        target: /run/keys
        read_only: true
    ports:
      - '127.0.0.1::8081'
